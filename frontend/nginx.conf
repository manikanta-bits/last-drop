# Serves the React app and forwards API + live-update traffic to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API -> Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Same address for browser and API, so no cross-site (CORS) check is needed
        proxy_set_header Origin "";
    }

    # Live price updates (WebSocket) -> Spring Boot
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_read_timeout 1h;
    }

    # Files with a hash in the name never change: cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other address (e.g. /deals, /products/5) is a React page
    location / {
        try_files $uri /index.html;
    }
}
