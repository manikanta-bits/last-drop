# Settings used ONLY when running tests (mvnw test).
# Tests use an in-memory H2 database in MySQL mode, so you don't need MySQL running.

spring.application.name=lastdrop-backend
app.cors.allowed-origins=http://localhost:5173

spring.datasource.url=jdbc:h2:mem:lastdrop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Tests build fresh tables from the Java classes, then throw them away
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-for-automated-tests-only-0123456789
app.jwt.expiration-minutes=60
