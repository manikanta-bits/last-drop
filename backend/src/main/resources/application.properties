# ==================================================================
# LASTDROP backend configuration - ready for Render (+ Railway MySQL)
#
# ${NAME:default} = use the environment variable NAME if it is set,
# otherwise the default after the colon.
#
# On Render, set these in  Service -> Environment  (values stay secret):
#   DB_HOST                Railway TCP proxy host, e.g. xxxx.proxy.rlwy.net
#   DB_PORT                Railway TCP proxy port
#   DB_NAME                railway
#   DB_USERNAME            root
#   DB_PASSWORD            Railway MySQL password
#   JWT_SECRET             long random text (40+ characters)
#   CORS_ALLOWED_ORIGINS   https://last-drop-eight.vercel.app
# Render sets PORT by itself.
#
# The defaults below are ONLY for running on your own PC.
# NEVER write real hosts, passwords or secrets in this file - it is on GitHub.
# ==================================================================

spring.application.name=lastdrop-backend

# ---------------- Web server ----------------
# Render tells the app which port to use through PORT
server.port=${PORT:8080}
# Render sits in front of the app as a proxy; trust its X-Forwarded-* headers (https, client address)
server.forward-headers-strategy=framework
# Smaller, faster API responses
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
# Finish requests in progress before stopping during a redeploy
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Frontend addresses allowed to call the API (comma-separated, no trailing slash needed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://last-drop-eight.vercel.app}

# ---------------- Database (MySQL on Railway) ----------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lastdrop}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:lastdrop}
spring.datasource.password=${DB_PASSWORD:lastdrop_dev}

# Connection pool sized for free plans (Railway limits connections, Render has 512 MB RAM).
# Railway's proxy drops idle connections, so connections are refreshed regularly.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.keepalive-time=60000

# Tables come from database/02-schema.sql.
# "validate" = Hibernate only CHECKS that the Java classes match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------- Login tokens (JWT) ----------------
# Must be at least 32 characters. The default is public (it is in GitHub) - ALWAYS set JWT_SECRET on Render.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
# How long a login lasts, in minutes (1440 = 24 hours)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---------------- Auctions ----------------
# Demo mode: every auction drops every 10 seconds (the admin can also switch it in the app)
app.demo-mode=${DEMO_MODE:false}
# How often the auction clock checks for due price drops, in milliseconds
app.scheduler.tick-ms=${SCHEDULER_TICK_MS:2000}
# How long a buyer has to collect a reservation, in minutes
app.reservation.hold-minutes=${RESERVATION_HOLD_MINUTES:30}

# ---------------- Sign in with Google (optional) ----------------
# OAuth Client ID from Google Cloud Console. Empty = Google button hidden, email/password login only.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ---------------- Firebase Authentication (optional) ----------------
# Path to the Firebase Admin SDK key file. Keep the key file OUT of Git (it is in .gitignore).
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}

# ---------------- Logging ----------------
# Quiet logs on Render; set LOG_LEVEL=DEBUG temporarily to investigate a problem
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN
