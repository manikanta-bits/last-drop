# ------------------------------------------------------------------
# LASTDROP backend configuration
#
# Syntax  ${ENV_VAR:default}  means: use the environment variable if it
# is set, otherwise use the default after the colon. Defaults here are
# for LOCAL DEVELOPMENT ONLY. On the live server every secret below
# (DB_PASSWORD, JWT_SECRET, ...) is set as an environment variable.
# ------------------------------------------------------------------

spring.application.name=lastdrop-backend

# Port the backend listens on (Render and similar hosts set PORT for you)
server.port=${PORT:8080}

# Comma-separated list of frontend addresses allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------- Database (MySQL) ----------------
spring.datasource.url=mysql://root:PyWgOVgRXamvUbTELJzEpguBEybEMjuB@autorack.proxy.rlwy.net:44555/railway
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:PyWgOVgRXamvUbTELJzEpguBEybEMjuB}

# The tables are created by database/02-schema.sql.
# "validate" = Hibernate only CHECKS that Java classes match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------- Login tokens (JWT) ----------------
# Secret used to sign tokens. Must be at least 32 characters.
# The default is for local development only - set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
# How long a login lasts, in minutes (1440 = 24 hours)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---------------- Auctions ----------------
# Demo mode: every auction drops every 10 seconds (admin can also switch it in the app)
app.demo-mode=${DEMO_MODE:false}
# How often the auction clock checks for due price drops, in milliseconds
app.scheduler.tick-ms=${SCHEDULER_TICK_MS:2000}
# How long a buyer has to collect a reservation, in minutes
app.reservation.hold-minutes=${RESERVATION_HOLD_MINUTES:30}

# ---------------- Firebase Authentication ----------------
# Path to Firebase Admin SDK service account key file (local testing)
# Supports 'classpath:firebase-service-account.json' or 'file:config/firebase-service-account.json'
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}

