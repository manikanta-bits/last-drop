# LASTDROP - the whole app in Docker: MySQL + Spring Boot backend + React frontend.
#
#   docker compose up --build        start everything (first run takes a few minutes)
#   open http://localhost:3000
#   docker compose down               stop
#   docker compose down -v            stop AND delete the database (fresh demo data next start)
#
# Settings come from a ".env" file next to this one (copy .env.example). Every value has a
# safe local default, so it also works without a .env file. Never commit real secrets.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass_change_me}
      MYSQL_DATABASE: lastdrop
      MYSQL_USER: lastdrop
      MYSQL_PASSWORD: ${DB_PASSWORD:-lastdrop_dev}
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, on the very first start: creates the tables and loads the demo data
      - ./database/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./database/03-sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lastdrop
      DB_USERNAME: lastdrop
      DB_PASSWORD: ${DB_PASSWORD:-lastdrop_dev}
      JWT_SECRET: ${JWT_SECRET:-docker-local-secret-change-me-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
